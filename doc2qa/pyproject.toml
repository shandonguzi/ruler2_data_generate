[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2qa"
version = "0.1.0"
description = "Evidence-first document QA synthesis with DeepEval"
requires-python = ">=3.11"
dependencies = [
  "deepeval==4.3.2", "PyYAML>=6,<7", "tiktoken>=0.9,<1",
  "pypdf>=5,<7", "python-docx>=1.1,<2",
]

[project.optional-dependencies]
docs = ["chromadb>=1,<2", "langchain-community>=0.3,<1", "langchain-text-splitters>=0.3,<1"]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
doc2qa = "doc2qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:deepeval"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
